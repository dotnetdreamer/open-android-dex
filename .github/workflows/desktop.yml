name: Build Desktop

# Run from main, this cuts a release. Run from any other branch — or as a dry
# run on main — it is a TEST BUILD: every installer is built from that exact
# commit and left on the run as an artifact to download, and nothing is
# versioned, tagged or released.
run-name: >-
  ${{ (github.ref_name != 'main' || inputs.dry_run) && format('Test build: {0}', github.ref_name) || 'Release' }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      version:
        description: "Exact version override (e.g. 0.2.0) — leave blank to use bump"
        type: string
        default: ""
      dry_run:
        description: "Test build — installers as artifacts, no release (always so on a branch other than main)"
        type: boolean
        default: false

concurrency:
  # Per branch: a test build must never cancel a release, nor another branch's.
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # Every scrcpy release bundles adb alongside it, on both platforms, which is
  # why this one pin covers both of the binaries the app spawns. Keep in sync
  # with open-android-dex-tauri/src-tauri/resources/THIRD_PARTY_LICENSES.md —
  # the "Verify bundled binaries" steps below enforce that.
  #
  # One version, four assets, four checksums: the Windows zip and the Linux
  # tarball here, and the two macOS tarballs on the build-macos matrix (a matrix
  # leg cannot read a workflow-level env key that varies by leg — which is why
  # only the two single-arch platforms can be named at this level). All four are
  # the values from the release's own SHA256SUMS.txt.
  SCRCPY_VERSION: "5.0.1"
  SCRCPY_SHA256_WIN64: "b12a2c4ee8be317422451fc7dcf8ee20a71b5ea7ef9ad73ddd825a25316227a5"
  SCRCPY_SHA256_LINUX64: "9f969d30cc574816077edecda65719c1c70b0aee1df1ba5fa00779ac07b8fd6e"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      # The release's version — meaningful only when `publish` is true.
      version: ${{ steps.calc.outputs.version }}
      # What the installers' file names say: the version on a release, and on a
      # test build the version it was built at plus where from, e.g.
      # 0.3.25-my-branch.1a2b3c4 — the app inside still reports 0.3.25.
      label: ${{ steps.calc.outputs.label }}
      publish: ${{ steps.calc.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - name: Calculate version
        id: calc
        env:
          # Through the environment, never spliced into the script: a branch
          # name is whatever someone typed.
          REF_NAME: ${{ github.ref_name }}
        run: |
          CURRENT=$(jq -r .version open-android-dex-tauri/package.json)
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            case "${{ inputs.bump }}" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
            esac
            VERSION="$MAJOR.$MINOR.$PATCH"
          fi
          # Only main releases. Anywhere else, and on a dry run, this is a test
          # build: nothing below bumps, commits, tags or publishes, every job
          # builds this run's exact commit, and the installers stay on the run.
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ "${{ inputs.dry_run }}" != "true" ]; then
            PUBLISH=true
            LABEL="$VERSION"
          else
            PUBLISH=false
            BRANCH=$(printf '%s' "$REF_NAME" | tr -c 'A-Za-z0-9._-' '-')
            LABEL="$CURRENT-$BRANCH.${GITHUB_SHA::7}"
            echo "Test build of \`$REF_NAME\` at \`${GITHUB_SHA::7}\` — the installers are this run's artifacts, kept 14 days. Nothing was versioned, tagged or released." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION  label: $LABEL  publish: $PUBLISH"

      - name: Update version in project files
        if: steps.calc.outputs.publish == 'true'
        run: |
          VERSION="${{ steps.calc.outputs.version }}"
          # package.json
          jq --arg v "$VERSION" '.version = $v' open-android-dex-tauri/package.json > tmp.json && mv tmp.json open-android-dex-tauri/package.json
          # tauri.conf.json
          jq --arg v "$VERSION" '.version = $v' open-android-dex-tauri/src-tauri/tauri.conf.json > tmp.json && mv tmp.json open-android-dex-tauri/src-tauri/tauri.conf.json
          # Cargo.toml
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" open-android-dex-tauri/src-tauri/Cargo.toml
          # …and Cargo.lock, which records the app's own version too. Left
          # behind, the next local build rewrites it and every working tree
          # carries a lockfile change nobody made (0.3.23 and 0.3.24 both
          # shipped that way). The version line straight after the package's
          # name is the one cargo would write; the grep fails the release if
          # the lockfile's shape ever stops matching.
          LOCK=open-android-dex-tauri/src-tauri/Cargo.lock
          sed -i "/^name = \"open-android-dex-tauri\"$/{n;s/^version = \".*\"/version = \"$VERSION\"/}" "$LOCK"
          grep -A1 '^name = "open-android-dex-tauri"$' "$LOCK" | grep -qx "version = \"$VERSION\""

          # The launcher APK. versionName is what the phone reports for the
          # on-device half of the product, and versionCode is the number Android
          # itself compares when deciding whether an install is an update. Both
          # were hardcoded at 0.2.0/2 and never touched, so every launcher ever
          # shipped claimed the same version and a phone running a stale one was
          # indistinguishable from a phone running the current release — the
          # only way to tell was to pull base.apk off the device and read its
          # manifest. Derived here from the one version that cuts the release,
          # so the two halves can never disagree again.
          #
          # MAJOR*10000 + MINOR*100 + PATCH stays monotonic for any MINOR/PATCH
          # under 100 (0.3.12 -> 312, 0.4.0 -> 400, 1.0.0 -> 10000). A version
          # that is not three plain numbers has no such mapping, and quietly
          # writing a broken build.gradle would fail much later inside Gradle —
          # so refuse it here, where the message says what is wrong.
          if [[ ! "$VERSION" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            echo "::error::version '$VERSION' is not MAJOR.MINOR.PATCH — the launcher versionCode cannot be derived from it"
            exit 1
          fi
          IFS='.' read -r VMAJ VMIN VPAT <<< "$VERSION"
          VCODE=$((VMAJ * 10000 + VMIN * 100 + VPAT))
          GRADLE=openandroiddex-launcher/app/build.gradle
          # Whole-line rewrites with the indentation spelled out rather than
          # a captured-group backreference: defaultConfig is 8 spaces deep, and
          # saying so survives the shell/YAML escaping a backreference does not.
          sed -i "s/^ *versionCode .*/        versionCode $VCODE/" "$GRADLE"
          sed -i "s/^ *versionName \".*\"/        versionName \"$VERSION\"/" "$GRADLE"
          grep -E '^ *version(Code|Name) ' "$GRADLE"

      - name: Commit and tag
        if: steps.calc.outputs.publish == 'true'
        run: |
          VERSION="${{ steps.calc.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: v$VERSION"
          git tag "v$VERSION"
          git push origin HEAD --tags

  # The phone-side payloads ship inside the desktop app: the launcher APK
  # (installed onto the phone by adb_start_launcher) and the wmd daemon dex
  # (pushed and started by start_wmd — without it there is no window chrome:
  # no custom titlebars, One UI's default caption shows instead). Both are
  # gitignored under src-tauri/resources/bin, so CI has to build them rather
  # than check them out.
  launcher:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.publish == 'true' && format('refs/tags/v{0}', needs.version.outputs.version) || github.sha }}

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # android-35 for the launcher APK, android-36 for the wmd dex (its
          # sources compile against the android-36 platform jar — see
          # openandroiddex-wmd/build.cmd).
          packages: "platforms;android-35 platforms;android-36 build-tools;35.0.0"

      - name: Setup Gradle
        # Version comes from the committed wrapper (openandroiddex-launcher/
        # gradle/wrapper/gradle-wrapper.properties), so CI and local dev build
        # with the same Gradle. This step is here for its dependency cache.
        uses: gradle/actions/setup-gradle@v4

      - name: Build launcher APK
        working-directory: openandroiddex-launcher
        # Debug, not release: the release build type has no signingConfig, so
        # assembleRelease would emit an unsigned APK that `adb install` rejects.
        #
        # The debug build signs with the keystore committed at
        # openandroiddex-launcher/app/debug.keystore, NOT with the per-machine
        # ~/.android/debug.keystore the Android Gradle Plugin generates by
        # default. That default made this runner — a fresh machine every run —
        # emit a differently-signed launcher for every release, which phones
        # then refused to install over the previous one
        # (INSTALL_FAILED_UPDATE_INCOMPATIBLE). Keep the signingConfig in
        # app/build.gradle intact or releases stop being upgradable again.
        run: ./gradlew --no-daemon assembleDebug

      - name: Build the standalone LinuxOnDroid APK
        working-directory: openandroiddex-launcher
        # The same sources as the launcher behind a three-component manifest —
        # see linuxapp/build.gradle. It ships as a release asset of its own, for
        # people who want Ubuntu on the phone and no desktop: nothing about the
        # container ever needed the PC, and this proves it by leaving the PC out.
        #
        # Debug for the same reason as the step above (release has no
        # signingConfig), and with the SAME committed key, which is what lets a
        # phone hold this and the launcher at once — two package names signed
        # alike collide over nothing.
        run: ./gradlew --no-daemon :linuxapp:assembleDebug

      - name: Build wmd daemon dex
        # openandroiddex-wmd is not an Android project — javac + d8 straight to
        # a single dex, loaded by app_process at uid 2000, so it has its own
        # build script rather than Gradle.
        #
        # The same script a developer runs (`npm run apk` invokes it on macOS
        # and Linux; build.cmd is its Windows twin). This step used to be a
        # third, inlined copy of the same three commands, which meant CI could
        # drift from local builds silently — now a break in the recipe fails
        # both at once. It picks up ANDROID_HOME and JAVA_HOME from the two
        # setup steps above.
        working-directory: openandroiddex-wmd
        run: ./build.sh

      - name: Build scrcpy's server from source, with our patch
        # The part of scrcpy that runs on the phone, rebuilt from scrcpy's own
        # source at SCRCPY_VERSION with openandroiddex-scrcpy/display-scale.patch
        # (a desktop that follows its window comes out at the screen's pixels,
        # not its points). The client stays the release download below; the
        # client refuses a server of any other version, hence the check. The
        # same script `npm run apk` runs locally.
        run: |
          grep -qF "SCRCPY_VERSION = '$SCRCPY_VERSION'" openandroiddex-scrcpy/build.mjs || {
            echo "::error::openandroiddex-scrcpy/build.mjs does not build scrcpy $SCRCPY_VERSION — update it alongside SCRCPY_VERSION"
            exit 1
          }
          node openandroiddex-scrcpy/build.mjs

      - name: Stage payloads under their shipped names
        # cp fails the job loudly if any build silently produced nothing. The
        # server is staged under the release's own name, so each platform job's
        # download of these payloads into resources/bin replaces the release's
        # server with ours.
        run: |
          mkdir -p payloads
          cp openandroiddex-launcher/app/build/outputs/apk/debug/app-debug.apk \
             payloads/openandroiddex-launcher.apk
          cp openandroiddex-wmd/openandroiddex-wmd.dex \
             payloads/openandroiddex-wmd.dex
          cp openandroiddex-scrcpy/build/scrcpy-server payloads/scrcpy-server

      - uses: actions/upload-artifact@v4
        with:
          name: phone-payloads
          path: payloads/*
          if-no-files-found: error
          retention-days: 1

      - name: Stage the two phone apps under their download names
        # The SAME two APKs the steps above already built, copied a second time
        # under a version-stamped name because these copies are downloaded BY
        # HAND from the releases page. The one staged into payloads/ is a build
        # input for the installer; these are the thing being published.
        #
        # The launcher is here for the phone that never meets the PC app: on a
        # monitor over HDMI, or in Samsung DeX, the launcher IS the desktop —
        # taskbar, app drawer, freeform windows, Linux. The only part that wants
        # the cable is the wmd daemon behind the custom titlebars, and without
        # it One UI's own window chrome takes over rather than nothing working.
        #
        # Both carry the committed debug key (app/debug.keystore), which is
        # deliberate and is what makes this channel coherent: sideload the
        # launcher from here, plug in the desktop app later, and its `install -r`
        # is a plain update instead of a signature conflict that uninstalls the
        # copy you had. The Play channel is release-signed and is built by
        # .github/workflows/android.yml — never mix a build from there with one
        # from here on the same phone.
        run: |
          mkdir -p standalone
          V="${{ needs.version.outputs.label }}"
          cp openandroiddex-launcher/app/build/outputs/apk/debug/app-debug.apk \
             "standalone/OpenAndroidDeX-Launcher-v$V.apk"
          cp openandroiddex-launcher/linuxapp/build/outputs/apk/debug/linuxapp-debug.apk \
             "standalone/LinuxOnDroid-v$V.apk"
          ls -l standalone

      - uses: actions/upload-artifact@v4
        with:
          # release-* is exactly what the release job globs, so attaching these
          # to the GitHub release takes no change there at all. Not retention-
          # limited like phone-payloads: that one is a build input, these are
          # the things being published. A test build names its artifacts for
          # what they are, and keeps them two weeks (0 = the repository's
          # default, for a release as before).
          name: ${{ needs.version.outputs.publish == 'true' && 'release-android' || format('Open.Android.DeX_{0}_phone', needs.version.outputs.label) }}
          path: standalone/*
          if-no-files-found: error
          retention-days: ${{ needs.version.outputs.publish != 'true' && 14 || 0 }}

  build-windows:
    needs: [version, launcher]
    runs-on: windows-latest
    env:
      # tauri.conf.json's beforeBuildCommand rebuilds the launcher APK and the
      # wmd daemon dex from source, so a local `tauri build` can never ship a
      # stale one. Here both would fail: this runner has no JDK and no Android
      # SDK. Both are already built by the `launcher` job above and downloaded
      # below — skip both halves of the script. (The "Verify bundled binaries"
      # step guarantees neither can silently go missing.)
      SKIP_LAUNCHER_APK: "1"
      SKIP_WMD_DEX: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.publish == 'true' && format('refs/tags/v{0}', needs.version.outputs.version) || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: open-android-dex-tauri/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: open-android-dex-tauri/src-tauri

      - name: Install frontend dependencies
        working-directory: open-android-dex-tauri
        run: npm ci

      # ---- populate src-tauri/resources/bin (gitignored, so absent on a fresh
      # checkout). tauri.conf.json declares it in bundle.resources and the build
      # script hard-fails on a missing resource path, so this must precede the
      # Tauri build.
      - name: Fetch scrcpy + adb
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = $env:SCRCPY_VERSION
          $bin = "open-android-dex-tauri/src-tauri/resources/bin"
          $zip = Join-Path $env:RUNNER_TEMP "scrcpy-win64-v$ver.zip"
          $out = Join-Path $env:RUNNER_TEMP "scrcpy"

          New-Item -ItemType Directory -Path $bin -Force | Out-Null

          $url = "https://github.com/Genymobile/scrcpy/releases/download/v$ver/scrcpy-win64-v$ver.zip"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $zip

          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $env:SCRCPY_SHA256_WIN64.ToLower()) {
            throw "scrcpy checksum mismatch`n  expected $($env:SCRCPY_SHA256_WIN64)`n  actual   $actual"
          }
          Write-Host "Checksum OK"

          Expand-Archive -Path $zip -DestinationPath $out -Force
          # the zip nests everything under scrcpy-win64-v<ver>/ — flatten it
          Copy-Item (Join-Path (Join-Path $out "scrcpy-win64-v$ver") '*') $bin -Recurse -Force

          # Launcher shims we do not ship — the app spawns scrcpy.exe directly.
          foreach ($shim in @('open_a_terminal_here.bat', 'scrcpy-console.bat', 'scrcpy-noconsole.vbs')) {
            $p = Join-Path $bin $shim
            if (Test-Path $p) { Remove-Item -LiteralPath $p -Force }
          }

      - name: Download phone payloads (launcher APK + wmd dex)
        uses: actions/download-artifact@v4
        with:
          name: phone-payloads
          path: open-android-dex-tauri/src-tauri/resources/bin

      - name: Verify bundled binaries
        shell: pwsh
        run: |
          $bin = "open-android-dex-tauri/src-tauri/resources/bin"
          # The DLL names carry their major versions (FFmpeg 9, SDL3 since
          # scrcpy 4.0), so this list moves with every scrcpy upgrade — a stale
          # name fails here rather than as a missing DLL on a user's machine.
          $required = @(
            'adb.exe', 'AdbWinApi.dll', 'AdbWinUsbApi.dll',
            'scrcpy.exe', 'scrcpy-server', 'SDL3.dll',
            'avcodec-63.dll', 'avformat-63.dll', 'avutil-61.dll',
            'swresample-7.dll', 'libusb-1.0.dll',
            'scrcpy.png', 'disconnected.png',
            'openandroiddex-launcher.apk', 'openandroiddex-wmd.dex'
          )
          $missing = $required | Where-Object { -not (Test-Path (Join-Path $bin $_)) }
          if ($missing) {
            throw "missing from ${bin}: $($missing -join ', ')"
          }

          # Keep the shipped licence notice honest about what is actually bundled.
          $lic = "open-android-dex-tauri/src-tauri/resources/THIRD_PARTY_LICENSES.md"
          if (-not (Select-String -Path $lic -Pattern "scrcpy $env:SCRCPY_VERSION" -SimpleMatch -Quiet)) {
            throw "THIRD_PARTY_LICENSES.md does not mention scrcpy $env:SCRCPY_VERSION — update it alongside SCRCPY_VERSION"
          }

          Get-ChildItem $bin | Select-Object Name, Length | Format-Table -AutoSize

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Static link MSVC C runtime for portability
          RUSTFLAGS: "-C target-feature=+crt-static"
        with:
          projectPath: open-android-dex-tauri
          tauriScript: npx tauri

      - name: Create portable zip
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.label }}"
          $exe_path = "open-android-dex-tauri/src-tauri/target/release/open-android-dex-tauri.exe"
          $zip_name = "Open.Android.DeX_${version}_x64_portable.zip"

          New-Item -ItemType Directory -Path portable -Force
          Copy-Item $exe_path portable/
          # Include resources if present
          $res = "open-android-dex-tauri/src-tauri/target/release/resources"
          if (Test-Path $res) { Copy-Item $res portable/resources -Recurse }
          Compress-Archive -Path portable/* -DestinationPath $zip_name

      # Uploaded, never published: the release is cut once, by the `release`
      # job, after every platform has finished. Publishing from here is what
      # this used to do, and it meant the release appeared — and watchers were
      # emailed — the moment Windows was done, with the Mac builds still
      # running and nothing to attach.
      - name: Stage release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item open-android-dex-tauri/src-tauri/target/release/bundle/nsis/*.exe dist/
          Copy-Item Open.Android.DeX_*.zip dist/
          Get-ChildItem dist | Select-Object Name, Length | Format-Table -AutoSize

      - uses: actions/upload-artifact@v4
        with:
          # A day as the release's input; two weeks as a test build's download.
          name: ${{ needs.version.outputs.publish == 'true' && 'release-windows' || format('Open.Android.DeX_{0}_windows', needs.version.outputs.label) }}
          path: dist/*
          if-no-files-found: error
          retention-days: ${{ needs.version.outputs.publish == 'true' && 1 || 14 }}

  build-macos:
    needs: [version, launcher]
    # One image, two Rust targets. macos-latest is Apple Silicon and
    # cross-compiles the Intel leg happily; building Intel natively would mean
    # macos-15-intel, the last x86_64 image, which GitHub retires in 2027.
    runs-on: macos-latest
    strategy:
      # Both arches are shipped, so a failure in one should still let the other
      # be inspected rather than cancelling it.
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            label: aarch64
            scrcpy_arch: aarch64
            # `lipo -archs` spells the same architecture differently from the
            # scrcpy asset name. Both are needed, so both are written down.
            lipo_arch: arm64
            scrcpy_sha256: "33611e51977a8289e2e124b220f727895181ef2eb9060e0987a4dc2db9cf0d6b"
          - target: x86_64-apple-darwin
            label: x64
            scrcpy_arch: x86_64
            lipo_arch: x86_64
            scrcpy_sha256: "31a5467a9e907f162b093267cbbab1276b15c6e709c2ea8159566a8d165beb50"
    env:
      # Same reasoning as the Windows job: this runner has no JDK and no
      # Android SDK, and both payloads arrive from the `launcher` job below.
      SKIP_LAUNCHER_APK: "1"
      SKIP_WMD_DEX: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.publish == 'true' && format('refs/tags/v{0}', needs.version.outputs.version) || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: open-android-dex-tauri/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # `--target` is only honoured once that target's std is installed,
          # and x86_64 is not the host here.
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: open-android-dex-tauri/src-tauri
          # Keyed per target, or the two legs thrash one shared cache entry.
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        working-directory: open-android-dex-tauri
        run: npm ci

      # ---- populate src-tauri/resources/bin, exactly as the Windows job does.
      # The macOS payload is far smaller: the shipped scrcpy links only against
      # system frameworks (verified with otool -L), so there are no SDL/FFmpeg/
      # libusb libraries to place beside it.
      - name: Fetch scrcpy + adb
        shell: bash
        env:
          ARCH: ${{ matrix.scrcpy_arch }}
          EXPECTED_SHA: ${{ matrix.scrcpy_sha256 }}
        run: |
          # GitHub's default is `bash -e`, which is neither -u nor pipefail —
          # and without pipefail the `shasum | cut` below would swallow a
          # failing shasum and pass the checksum gate on an empty string.
          set -euo pipefail

          ver="$SCRCPY_VERSION"
          bin="open-android-dex-tauri/src-tauri/resources/bin"
          tgz="$RUNNER_TEMP/scrcpy-macos-$ARCH-v$ver.tar.gz"
          out="$RUNNER_TEMP/scrcpy"
          mkdir -p "$bin" "$out"

          url="https://github.com/Genymobile/scrcpy/releases/download/v$ver/scrcpy-macos-$ARCH-v$ver.tar.gz"
          echo "Downloading $url"
          # --fail, or a 404 writes its HTML body to the file and the checksum
          # then reports a mismatch instead of a missing download.
          curl --fail --location --show-error --silent \
               --retry 3 --retry-all-errors \
               --output "$tgz" "$url"

          actual="$(shasum -a 256 "$tgz" | cut -d' ' -f1)"
          if [ "$actual" != "$EXPECTED_SHA" ]; then
            echo "::error title=scrcpy checksum mismatch::macos-$ARCH v$ver"
            echo "  expected $EXPECTED_SHA"
            echo "  actual   $actual"
            exit 1
          fi
          echo "Checksum OK"

          tar xzf "$tgz" -C "$out"
          # the tarball nests everything under scrcpy-macos-<arch>-v<ver>/ —
          # flatten it. `cp -a` and not `cp -R`: only -a keeps the mode bits.
          cp -a "$out/scrcpy-macos-$ARCH-v$ver/." "$bin/"

          # The man page is not something a .app has anywhere to put, and
          # shipping it would mean listing it in THIRD_PARTY_LICENSES.md. (The
          # Windows job drops its .bat/.vbs launcher shims at the same point.)
          rm -f "$bin/scrcpy.1"

          chmod +x "$bin/adb" "$bin/scrcpy"
          ls -l "$bin"

      - name: Download phone payloads (launcher APK + wmd dex)
        uses: actions/download-artifact@v4
        with:
          name: phone-payloads
          path: open-android-dex-tauri/src-tauri/resources/bin

      - name: Verify bundled binaries
        shell: bash
        run: |
          set -euo pipefail
          bin="open-android-dex-tauri/src-tauri/resources/bin"

          missing=()
          for f in adb scrcpy scrcpy-server scrcpy.png disconnected.png \
                   openandroiddex-launcher.apk openandroiddex-wmd.dex; do
            [ -f "$bin/$f" ] || missing+=("$f")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::missing from $bin: ${missing[*]}"
            exit 1
          fi

          # Two checks the Windows list has no need of. A cleared execute bit
          # is invisible until the first adb call fails at runtime with a
          # permission error that names no cause…
          for f in adb scrcpy; do
            [ -x "$bin/$f" ] || { echo "::error::$bin/$f is not executable"; exit 1; }
          done
          # …and pairing the wrong tarball with this build is invisible until
          # the app runs on a Mac that cannot execute it. (adb is a universal
          # binary in both tarballs, so only scrcpy is worth asserting.)
          archs="$(lipo -archs "$bin/scrcpy")"
          case " $archs " in
            *" ${{ matrix.lipo_arch }} "*) ;;
            *) echo "::error::scrcpy is $archs, expected ${{ matrix.lipo_arch }}"; exit 1 ;;
          esac

          # Keep the shipped licence notice honest about what is actually bundled.
          lic="open-android-dex-tauri/src-tauri/resources/THIRD_PARTY_LICENSES.md"
          grep -qF "scrcpy $SCRCPY_VERSION" "$lic" || {
            echo "::error::THIRD_PARTY_LICENSES.md does not mention scrcpy $SCRCPY_VERSION — update it alongside SCRCPY_VERSION"
            exit 1
          }

          ls -l "$bin"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No RUSTFLAGS here. The Windows job's `+crt-static` statically links
          # the MSVC runtime; on Apple targets the flag is silently ignored
          # (there is no static libSystem), and setting it anyway would both
          # state something untrue and partition the Rust cache.
        with:
          projectPath: open-android-dex-tauri
          tauriScript: npx tauri
          # `--bundles` overrides tauri.conf.json's Windows-only ["nsis"].
          # tauri.macos.conf.json sets the same pair, so this is belt and
          # braces — and it is what documents the intent at the call site.
          args: --target ${{ matrix.target }} --bundles app,dmg

      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail
          V="${{ needs.version.outputs.label }}"
          # `--target` moves the whole tree under the triple.
          B="open-android-dex-tauri/src-tauri/target/${{ matrix.target }}/release/bundle"
          mkdir -p dist
          cp "$B"/dmg/*.dmg dist/
          # ditto, never `zip -r`: it is the only archiver that round-trips a
          # .app with its symlinks, resource forks and code signature intact.
          # (The .dmg needs no such care — it is an opaque filesystem image.)
          ditto -c -k --keepParent --sequesterRsrc \
            "$B/macos/Open Android DeX.app" \
            "dist/Open.Android.DeX_${V}_${{ matrix.label }}.app.zip"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.version.outputs.publish == 'true' && format('release-macos-{0}', matrix.label) || format('Open.Android.DeX_{0}_macos-{1}', needs.version.outputs.label, matrix.label) }}
          path: dist/*
          if-no-files-found: error
          retention-days: ${{ needs.version.outputs.publish == 'true' && 1 || 14 }}

  build-linux:
    needs: [version, launcher]
    # One arch only. scrcpy publishes a single Linux asset (x86_64); there is no
    # aarch64 tarball to pair with an ARM runner, and shipping a Linux build we
    # could not put a working scrcpy inside would be worse than not shipping one.
    #
    # Pinned, and not for tidiness — on Linux the runner image IS the
    # compatibility floor. glibc is backward but not forward compatible, so a
    # binary linked here runs on this release and newer and nothing older;
    # `ubuntu-latest` would move that floor under a released product without a
    # line of this file changing. 24.04 is what these steps were built and run
    # against, so it is what is written down. Raising it is a decision about
    # which distros keep working, and it should look like one.
    runs-on: ubuntu-24.04
    env:
      # Same reasoning as the Windows and macOS jobs: no JDK, no Android SDK on
      # this runner, and both payloads arrive from the `launcher` job.
      SKIP_LAUNCHER_APK: "1"
      SKIP_WMD_DEX: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.publish == 'true' && format('refs/tags/v{0}', needs.version.outputs.version) || github.sha }}

      # Tauri's Linux build needs the system webview and GTK; the bundler needs
      # librsvg for the icons and patchelf to fix the AppImage's rpaths. Each of
      # these is a build-time dependency of a step that fails late and cryptically
      # without it, which is why they are installed before anything else runs.
      #
      # `libwebkit2gtk-4.1-dev`, NOT 4.0: ubuntu-latest is 24.04, which dropped
      # the 4.0 package entirely. Pinning the old name is the single most common
      # way this job breaks — and it breaks at apt, before any Rust is compiled,
      # so the error names the package rather than a missing symbol.
      #
      # `xdg-utils` is here because the AppImage bundler copies /usr/bin/xdg-open
      # into the image — this app opens URLs through tauri-plugin-opener — and
      # fails with "xdg-open binary not found" if it is absent. The runner image
      # happens to ship it today, so this line buys nothing on a green run; it is
      # what stops a slimmed-down future runner from failing the LAST bundler of
      # the three, after the deb and rpm have already been built. (Found by
      # building this job's steps in a bare ubuntu:24.04 container, where it is
      # genuinely missing.)
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            desktop-file-utils \
            xdg-utils \
            build-essential \
            file

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: open-android-dex-tauri/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: open-android-dex-tauri/src-tauri

      - name: Install frontend dependencies
        working-directory: open-android-dex-tauri
        run: npm ci

      # The AppImage bundler fetches its own toolchain at build time — AppRun,
      # linuxdeploy, and the gtk and gstreamer plugins — from three different
      # hosts. That is a network dependency the .deb and .rpm halves do not
      # have, and it is the one part of this job that can fail for reasons
      # nothing here controls. Caching it turns a repeated download into a
      # first-run cost and takes that failure mode off the table for reruns.
      - name: Cache AppImage tooling
        uses: actions/cache@v4
        with:
          path: ~/.cache/tauri
          key: appimage-tools-x86_64

      # ---- populate src-tauri/resources/bin, exactly as the other two jobs do.
      # The Linux payload is the same shape as the macOS one and for the same
      # reason: the shipped scrcpy is statically linked against SDL, FFmpeg and
      # libusb (`ldd` names only libc, libm, libudev and libcap), so there are
      # no media libraries to place beside it the way the Windows zip needs.
      - name: Fetch scrcpy + adb
        shell: bash
        run: |
          # Not GitHub's default `bash -e`: without pipefail the `sha256sum |
          # cut` below would swallow a failing sha256sum and pass the checksum
          # gate on an empty string.
          set -euo pipefail

          ver="$SCRCPY_VERSION"
          bin="open-android-dex-tauri/src-tauri/resources/bin"
          tgz="$RUNNER_TEMP/scrcpy-linux-x86_64-v$ver.tar.gz"
          out="$RUNNER_TEMP/scrcpy"
          mkdir -p "$bin" "$out"

          url="https://github.com/Genymobile/scrcpy/releases/download/v$ver/scrcpy-linux-x86_64-v$ver.tar.gz"
          echo "Downloading $url"
          # --fail, or a 404 writes its HTML body to the file and the checksum
          # then reports a mismatch instead of a missing download.
          curl --fail --location --show-error --silent \
               --retry 3 --retry-all-errors \
               --output "$tgz" "$url"

          actual="$(sha256sum "$tgz" | cut -d' ' -f1)"
          if [ "$actual" != "$SCRCPY_SHA256_LINUX64" ]; then
            echo "::error title=scrcpy checksum mismatch::linux-x86_64 v$ver"
            echo "  expected $SCRCPY_SHA256_LINUX64"
            echo "  actual   $actual"
            exit 1
          fi
          echo "Checksum OK"

          tar xzf "$tgz" -C "$out"
          # the tarball nests everything under scrcpy-linux-x86_64-v<ver>/ —
          # flatten it. `cp -a` and not `cp -R`: only -a keeps the mode bits.
          cp -a "$out/scrcpy-linux-x86_64-v$ver/." "$bin/"

          # The man page has nowhere to go inside a .deb's private resource
          # directory, and shipping it would mean listing it in
          # THIRD_PARTY_LICENSES.md. (The macOS job drops the same file; the
          # Windows job drops its .bat/.vbs launcher shims at this point.)
          rm -f "$bin/scrcpy.1"

          chmod +x "$bin/adb" "$bin/scrcpy"
          ls -l "$bin"

      - name: Download phone payloads (launcher APK + wmd dex)
        uses: actions/download-artifact@v4
        with:
          name: phone-payloads
          path: open-android-dex-tauri/src-tauri/resources/bin

      - name: Verify bundled binaries
        shell: bash
        run: |
          set -euo pipefail
          bin="open-android-dex-tauri/src-tauri/resources/bin"

          missing=()
          for f in adb scrcpy scrcpy-server scrcpy.png disconnected.png \
                   openandroiddex-launcher.apk openandroiddex-wmd.dex; do
            [ -f "$bin/$f" ] || missing+=("$f")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::missing from $bin: ${missing[*]}"
            exit 1
          fi

          # A cleared execute bit is invisible until the first adb call fails at
          # runtime with a permission error that names no cause.
          for f in adb scrcpy; do
            [ -x "$bin/$f" ] || { echo "::error::$bin/$f is not executable"; exit 1; }
          done

          # …and the wrong tarball is invisible until the app runs on a machine
          # that cannot execute it. `file` is the Linux answer to the macOS job's
          # `lipo -archs`; unlike lipo it reports one architecture rather than a
          # list, because ELF has no fat binaries.
          for f in adb scrcpy; do
            case "$(file -b "$bin/$f")" in
              *x86-64*) ;;
              *) echo "::error::$f is $(file -b "$bin/$f"), expected x86-64"; exit 1 ;;
            esac
          done

          # scrcpy's Linux release links SDL, FFmpeg and libusb statically —
          # `ldd` names only libc, libm, libudev and libcap. That fact is what
          # lets the .deb declare two extra dependencies rather than a media
          # stack, so it is an assumption this build rests on rather than a
          # detail. If upstream ever ships a dynamic build instead, the package
          # still builds and installs and then fails to run on any machine
          # without SDL — assert it here, where the message says what changed.
          #
          # `libSDL` rather than a version, so the check cannot pass vacuously
          # across an SDL major (scrcpy 4.0 moved from SDL2 to SDL3). `libva` is
          # scrcpy 5.0's hardware decoding: it is dlopen()ed at runtime today,
          # which is what keeps it optional — no libva just means software
          # decoding. Linked outright it would be a new .deb dependency.
          for lib in libSDL libavcodec libavformat libavutil libswresample libusb libva; do
            if ldd "$bin/scrcpy" | grep -q "$lib"; then
              echo "::error::bundled scrcpy now links $lib dynamically — it used to be static."
              echo "  The deb/rpm dependency lists in tauri.linux.conf.json no longer cover it."
              ldd "$bin/scrcpy"
              exit 1
            fi
          done

          # Keep the shipped licence notice honest about what is actually bundled.
          lic="open-android-dex-tauri/src-tauri/resources/THIRD_PARTY_LICENSES.md"
          grep -qF "scrcpy $SCRCPY_VERSION" "$lic" || {
            echo "::error::THIRD_PARTY_LICENSES.md does not mention scrcpy $SCRCPY_VERSION — update it alongside SCRCPY_VERSION"
            exit 1
          }

          ls -l "$bin"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No RUSTFLAGS here. `+crt-static` is the Windows job's way of not
          # depending on a redistributable MSVC runtime; the Linux equivalent
          # would be a static glibc, which breaks NSS and is not what any distro
          # expects a .deb to do. The .deb and .rpm declare their dependencies
          # instead (tauri.linux.conf.json), and the AppImage carries its own.
        with:
          projectPath: open-android-dex-tauri
          tauriScript: npx tauri
          # `--bundles` overrides tauri.conf.json's Windows-only ["nsis"].
          # tauri.linux.conf.json sets the same three, so this is belt and
          # braces — and it is what documents the intent at the call site.
          args: --bundles deb,rpm,appimage

      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail
          V="${{ needs.version.outputs.label }}"
          # No `--target`, so the bundle tree is directly under release/ — the
          # same shape as the Windows job, not the macOS one.
          B="open-android-dex-tauri/src-tauri/target/release/bundle"
          mkdir -p dist

          # Renamed to the Open.Android.DeX_<version>_<arch>.<ext> shape the
          # other platforms publish. The bundler's own names differ per format —
          # deb is lower-case-and-hyphens, rpm carries a release number, the
          # AppImage keeps the product name — and a releases page listing three
          # spellings of one product reads as three different things.
          cp "$B"/deb/*.deb           "dist/Open.Android.DeX_${V}_amd64.deb"
          cp "$B"/rpm/*.rpm           "dist/Open.Android.DeX_${V}_x86_64.rpm"
          cp "$B"/appimage/*.AppImage "dist/Open.Android.DeX_${V}_amd64.AppImage"
          ls -l dist

      # The AppImage's own execute bit does not survive this — upload-artifact
      # strips it, and so does every browser that downloads one. That is why the
      # release notes say to `chmod +x` it, and it is not worth working around:
      # the bits inside the .deb and .rpm are carried by the archive format
      # itself, so the packaged installs are unaffected.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.version.outputs.publish == 'true' && 'release-linux' || format('Open.Android.DeX_{0}_linux', needs.version.outputs.label) }}
          path: dist/*
          if-no-files-found: error
          retention-days: ${{ needs.version.outputs.publish == 'true' && 1 || 14 }}

  # One release, cut once, with every platform's artifacts already in hand.
  # Naming every build job in `needs` waits for the macOS matrix in full.
  release:
    needs: [version, build-windows, build-macos, build-linux]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/v${{ needs.version.outputs.version }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          # release-windows, release-macos-aarch64, release-macos-x64 and
          # release-android (the two sideloadable phone APKs). merge-multiple
          # flattens them into dist/ rather than one directory each; the file
          # names do not collide.
          pattern: release-*
          merge-multiple: true

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.version.outputs.version }}"
          ls -l dist

          # --notes-file AND --generate-notes: GitHub appends the generated
          # changelog after the body, which puts the macOS first-launch
          # instructions where someone will actually read them.
          gh release create "v$VERSION" \
            --title "Open Android DeX v$VERSION" \
            --notes-file .github/release-notes.md \
            --generate-notes \
            dist/*
