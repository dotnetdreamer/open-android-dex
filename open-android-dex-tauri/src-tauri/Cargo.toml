[package]
name = "open-android-dex-tauri"
version = "0.3.24"
description = "Samsung-DeX-style desktop for Android phones"
authors = ["Idrees Khan"]
license = "GPL-3.0-or-later"
repository = "https://github.com/dotnetdreamer/open-android-dex"
edition = "2021"

[lib]
name = "open_android_dex_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# The bundled launcher's hash, to tell a phone already running that build (adb.rs).
sha2 = "0.10"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-clipboard-manager = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# local-clock timestamps in the trace log, so its lines line up with the
# phone's `logcat -v time` output and with the user's own clock
time = { version = "0.3", features = ["formatting", "macros", "local-offset"] }
# QR pairing (wireless.rs). default-features off drops the `image`/`svg`
# renderers with their own dependency trees — we only ever need the module
# matrix, which the connect screen draws as an SVG itself.
qrcode = { version = "0.14", default-features = false }
# Lets the frontend ask which host it is on, synchronously and before first
# paint — the titlebar is laid out differently on macOS (traffic lights on the
# left, drawn by the system) and the Miracast tab does not exist there at all.
tauri-plugin-os = "2"
# Remote access: SSH into the phone's Linux from this computer, from any
# network. The same crate the phone's daemon is built from, so the two ends
# share one protocol implementation and `cargo test` there runs both against
# each other. It brings iroh (QUIC, hole punching, the relay fallback).
openandroiddex-remote = { path = "../../openandroiddex-remote" }
# The ProxyCommand runs before Tauri does and needs a runtime of its own; this
# is the same tokio Tauri already links.
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    # BCryptGenRandom — the QR pairing password is a live credential for the
    # phone, so it comes from the system CSPRNG rather than a seeded hasher.
    "Win32_Security_Cryptography",
    # Touchpad gestures (gestures/windows.rs). Raw input subscribes to the
    # Precision Touchpad's HID collection; HidP_* turns its reports into
    # contacts; the registry is where Windows keeps what ITS own three-finger
    # gestures do, which has to be stood down while ours are live.
    "Win32_UI_Input",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_System_Registry",
    # GetCurrentThreadId — the Escape hook has no window, so its quit message
    # is addressed to the thread (hotkeys/windows.rs). Declared rather than
    # leaned on: tao enables it today, and a build that depends on someone
    # else's feature list breaks the day they trim it.
    "Win32_System_Threading",
    # GetAsyncKeyState and the VK_* codes, so the Escape hook can tell a bare
    # Escape from Ctrl+Escape — which is the Start menu, and not ours to eat.
    "Win32_UI_Input_KeyboardAndMouse",
    # AdjustWindowRectExForDpi: the frame scrcpy's window will get, so its
    # content can be placed one pixel for one on the screen (display.rs).
    "Win32_UI_HiDpi",
    # The job every scrcpy is put in, which ends them with this app however
    # it ends (scrcpy.rs, end_with_this_app).
    "Win32_System_JobObjects",
] }

# The phone's apps in windows of their own (src/apps/win): a Win32 window per
# app, its picture decoded by Media Foundation on the window's own D3D11
# device and presented through a flip-model swap chain, its title bar drawn
# with Direct2D and DirectWrite, its icon decoded with WIC, its taskbar
# identity set through the shell's property store. COM throughout, which
# windows-sys does not do. The version is the one wry already brings in.
windows = { version = "0.62", features = [
    # The phone's notifications as this computer's own (src/notifications):
    # a toast is an XML document handed to the toast notifier, and what the
    # person typed into its reply box comes back as a value set.
    "Data_Xml_Dom",
    "Foundation",
    "Foundation_Collections",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Media_MediaFoundation",
    "Win32_Storage_EnhancedStorage",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    # This computer's clipboard, watched as it changes and read where a
    # password manager may have marked it as not for other devices
    # (apps/clipboard.rs).
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    # A drag carried out of a phone app's window, and what the phone copied,
    # as files here: the shell's own data object for them, dragged with
    # SHDoDragDrop or flushed onto the clipboard (apps/win, apps/clipboard.rs).
    "Win32_System_Ole",
    # When a frame reached the screen: DXGI's frame statistics are in QPC time.
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

# Native window control for the spawned scrcpy windows (embed/macos.rs).
# Both crates are already in the tree — tao and wry build on them — so this
# adds resolution, not compilation. The Accessibility API needs no crate: it is
# six C entry points in ApplicationServices, declared in that module.
#
# There is no macOS counterpart to the CSPRNG entry above: `fill_random` reads
# /dev/urandom on every non-Windows host (wireless.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", features = [
    "CFBase",
    "CFString",
    "CFDictionary",
    # The window list a desktop that follows its window is watched through
    # (embed/macos.rs window_scale): an array of dictionaries of numbers.
    "CFArray",
    "CFNumber",
    "CFCGTypes",
    # The trackpad tap is a Mach port pumped on a run loop of its own
    # (gestures/macos.rs), which is the only way to receive one off the main
    # thread.
    "CFMachPort",
    "CFRunLoop",
] }
# `NSEnumerator` is what puts `iter()` on the NSSet of touches an event
# carries; without it the set can be counted but not walked.
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSSet",
    "NSEnumerator",
    # NSRect and friends, for the title bar measurement in display.rs.
    "NSGeometry",
    # The phone apps' windows (apps/mac): text input's strings and ranges, the
    # window delegate's notifications, a display layer's error, an app's icon.
    "NSArray",
    "NSAttributedString",
    "NSData",
    "NSError",
    "NSNotification",
    "NSObjCRuntime",
    "NSRange",
    "NSString",
    # A file dropped on one of them, as Finder hands it over.
    "NSURL",
    # Whether this run is the app bundle, which the notification center needs.
    "NSBundle",
    # A drag carried out of a phone app's window (apps/mac): the queue its
    # files are written on as they are dropped, and the error a failed one gives.
    "NSOperation",
    "NSDictionary",
] }
# Quartz Event Services, for the trackpad tap. Already in the tree via
# objc2-app-kit, so this adds resolution rather than compilation — and unlike
# the Accessibility API in embed/macos.rs, the tap is enough C surface
# (callback types, four enums, a Mach port) that hand-declaring it would be
# a liability rather than six lines.
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "std",
    "objc2",
    "CGEvent",
    "CGEventTypes",
    # Which screen the desktop's window is on (embed/macos.rs window_scale).
    "CGWindow",
    "CGGeometry",
    # The phone's touchpad moving this Mac's pointer over the phone's windows
    # (apps/mac, pad): a warp, which takes no permission and posts no event.
    "CGRemoteOperation",
    "CGError",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    # runningApplicationWithProcessIdentifier: takes a pid_t, which this
    # feature is what supplies.
    "libc",
    "NSRunningApplication",
    # Trackpad gestures (gestures/macos.rs). A CGEvent carries no public touch
    # data; NSEvent does, and NSTouch is where a finger's normalised position
    # comes from. NSWorkspace answers which application is in front, which is
    # what stops a swipe in another app from reaching the phone.
    "NSEvent",
    "NSTouch",
    # touchesMatchingPhase:inView: is declared on NSEvent but gated behind
    # both of these, because its argument is an NSView.
    "NSResponder",
    "NSView",
    "NSWorkspace",
    # frameRectForContentRect:styleMask: — how tall the title bar of the
    # desktop's window will be (display.rs).
    "NSWindow",
    # …and eventWithCGEvent: is gated behind the CoreGraphics bridge.
    "objc2-core-graphics",
    # The phone's apps in windows of their own (apps/mac): the window, its
    # view and its text input, the title bar's Back, the screens, and the
    # view's layer that the picture's layer sits in.
    "NSApplication",
    "NSButton",
    "NSColor",
    "NSControl",
    "NSGraphics",
    "NSImage",
    "NSLayoutConstraint",
    "NSScreen",
    "NSText",
    "NSTextField",
    "NSTextInputClient",
    "NSTitlebarAccessoryViewController",
    "NSTrackingArea",
    "NSViewController",
    "objc2-quartz-core",
    # Their sound menu, the files dropped on them, and this Mac's clipboard
    # watched as it changes (apps/mac, apps/clipboard.rs).
    "NSCell",
    "NSDragging",
    "NSMenu",
    "NSMenuItem",
    "NSPasteboard",
    "NSPasteboardItem",
    # …the title bar's More, and the small bar a full-screen window slides
    # down from the top of the screen (More's menu is NSMenu's, above).
    "NSAnimation",
    "NSAnimationContext",
    "NSFont",
    "NSFontDescriptor",
    "NSParagraphStyle",
    "NSVisualEffectView",
    # …a drag carried out of one onto this Mac: Finder's own kind, files
    # promised and written as they are dropped (apps/mac).
    "block2",
    "NSDraggingItem",
    "NSDraggingSession",
    "NSFilePromiseProvider",
] }
# The picture of a phone app's window on a Mac (apps/mac/video.rs): a layer
# macOS decodes H.264 into, and the CoreMedia buffers it takes. The same
# objc2 family as the rest, so these add bindings rather than a new runtime.
objc2-av-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "AVAnimation",
    "AVQueuedSampleBufferRendering",
    "AVSampleBufferDisplayLayer",
    "objc2-core-media",
    "objc2-quartz-core",
] }
objc2-core-media = { version = "0.3", default-features = false, features = [
    "std",
    "CMBase",
    "CMBlockBuffer",
    "CMFormatDescription",
    "CMSampleBuffer",
    "CMTime",
] }
objc2-quartz-core = { version = "0.3", default-features = false, features = [
    "std",
    "CALayer",
    "CATransaction",
    "objc2-core-foundation",
] }
# The main thread's queue, which AppKit's work for those windows goes through.
dispatch2 = "0.3"
# The phone's notifications as this Mac's own (src/notifications/macos.rs):
# the notification center, its categories of buttons and reply box, and the
# delegate that hears a click. Already in the tree (UIKit's bindings bring
# it), so this adds compilation for the Mac, not a new family. Its completion
# handlers are blocks.
objc2-user-notifications = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "bitflags",
    "UNNotification",
    "UNNotificationAction",
    "UNNotificationAttachment",
    "UNNotificationCategory",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationResponse",
    "UNNotificationSettings",
    "UNNotificationSound",
    "UNNotificationTrigger",
    "UNUserNotificationCenter",
] }
block2 = "0.6"
