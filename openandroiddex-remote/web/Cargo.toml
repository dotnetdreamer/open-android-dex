[package]
name = "dexremote-web"
version = "0.1.0"
edition = "2021"
publish = false
description = "Remote desktop in a browser from anywhere: the phone's tunnel (iroh) in WebAssembly"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
iroh = { version = "1.3", default-features = false, features = ["tls-ring"] }
wasm-bindgen = "=0.2.122"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
getrandom = { version = "0.3", features = ["wasm_js"] }
n0-future = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
data-encoding = "2"
tokio = { version = "1", default-features = false, features = ["io-util", "sync"] }
anyhow = "1"
console_error_panic_hook = "0.1"
base64 = "0.22"
