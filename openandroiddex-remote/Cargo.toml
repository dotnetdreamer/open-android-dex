[package]
name = "openandroiddex-remote"
version = "0.1.0"
description = "Remote access to the phone's Linux: SSH and its desktop from any computer, on any network"
authors = ["Idrees Khan"]
license = "GPL-3.0-or-later"
repository = "https://github.com/dotnetdreamer/open-android-dex"
edition = "2021"
publish = false

# One crate, two ends. The phone runs the `dexremote` binary (built for the two
# Android ABIs by build-android.sh and committed to the launcher's jniLibs as
# libdexremote.so); the desktop app links the library and is the other end of
# every connection. Sharing the protocol code is the point: neither side can
# drift from the other, and `cargo test` here runs both against each other.
[lib]
name = "dexremote"
path = "src/lib.rs"

[[bin]]
name = "dexremote"
path = "src/main.rs"

[features]
# Copying files onto the phone's Linux (src/sftp.rs, `dexremote put`, the
# desktop window's drops): an SSH and SFTP client, in process. A computer's
# build has it; the phone's does not (build-android.sh), since the phone never
# dials anyone and the binary ships twice in every APK.
default = ["sftp"]
sftp = ["dep:russh", "dep:russh-sftp", "dep:tokio-util", "dep:futures-util"]

[dependencies]
# default-features off drops `metrics`, which nothing here reads. portmapper
# stays: asking the phone's home router for a mapping (UPnP / NAT-PMP / PCP) is
# what turns "phone on home Wi-Fi, laptop in a café" into a direct path instead
# of a relayed one, and that is the most common shape of this feature's use.
iroh = { version = "1.3", default-features = false, features = ["tls-ring", "portmapper", "fast-apple-datapath"] }
# `signal`: `dexremote desktop` hangs up properly on Ctrl+C, so the phone drops
# the session — and its wake lock — then, not at QUIC's idle timeout.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "net", "time", "sync", "fs", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Already in iroh's tree. HMAC and PBKDF2 are implemented over sha2 in
# crypto.rs rather than pulling the RustCrypto crates for a dozen lines each.
sha2 = "0.11"
subtle = "2.6"
base64 = "0.22"
data-encoding = "2"
getrandom = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "registry"] }
anyhow = "1"
# The `sftp` feature. ring rather than russh's default aws-lc-rs: ring is in
# the tree already, for iroh, and aws-lc-rs is a C build that wants CMake and
# NASM on Windows. russh-sftp 2.4 rather than 3: the same pipelined writes,
# and 3.0 raised its floor for log, thiserror and the wasm-bindgen family
# past what the desktop app's lockfile holds.
russh = { version = "0.64", default-features = false, features = ["ring"], optional = true }
russh-sftp = { version = "2.4", optional = true }
tokio-util = { version = "0.7", default-features = false, optional = true }
futures-util = { version = "0.3", optional = true }

# flock(2), for the identity lock. std's File::lock compiles for Android but
# answers Unsupported there; libc is in the tree already, under tokio.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Only applies when this crate is the root of the build, i.e. to the phone
# binary. The desktop app links the library under its own profile.
#
# Size over speed, within reason: the binary ships twice in every APK (arm64 and
# x86_64), and what it moves is an SSH session, not a file server. QUIC's crypto
# is ring's hand-written assembly either way.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
