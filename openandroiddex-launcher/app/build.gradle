plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ccrstech.openandroiddex.launcher'
    compileSdk 36

    defaultConfig {
        applicationId "com.ccrstech.openandroiddex.launcher"
        minSdk 26
        targetSdk 35
        // Rewritten by .github/workflows/desktop.yml on every release, from the
        // single version that cut it: versionName is that string verbatim, and
        // versionCode is MAJOR*10000 + MINOR*100 + PATCH (0.3.11 -> 311), which
        // stays monotonic for any MINOR/PATCH under 100.
        //
        // Both used to be pinned here and never touched, so every launcher ever
        // built — the first prototype and the current release alike — reported
        // 0.2.0/2. A phone therefore could not say which launcher it had, and
        // finding a stale one meant pulling base.apk off the device and reading
        // its manifest. Keep these in step with open-android-dex-tauri/
        // package.json when changing them by hand.
        versionCode 313
        versionName "0.3.13"

        // The jniLibs this APK ships by hand (proot, QEMU) exist for these two
        // only, so a third ABI would produce a build that installs and then
        // cannot run half its features. Stated here as well because the WebRTC
        // AAR below carries four, and without a filter the APK would grow by
        // ~20 MB of armeabi-v7a and x86 code nothing in it can use.
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    // The debug key is checked in on purpose. Left to itself, the Android
    // Gradle Plugin signs debug builds with ~/.android/debug.keystore, which it
    // generates on demand *per machine* — so every developer and every
    // (ephemeral) CI runner produces a differently-signed launcher. Android
    // only accepts an update signed with the same key as the installed copy, so
    // any phone that already had the launcher rejected the next build with
    // INSTALL_FAILED_UPDATE_INCOMPATIBLE and the desktop never came up. Pinning
    // the key here makes every build — local or CI — an installable update of
    // every other one.
    //
    // These are the well-known Android debug credentials, public by design and
    // identical on every Android developer's machine. This is not a release key
    // and must never become one: Play rejects debug-signed APKs outright, so
    // shipping there would mean adding a separate release signingConfig backed
    // by a private key.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug

            // assembleDebug is what SHIPS (release is unsigned, see above), so
            // a debuggable APK would put a debug build in every user's hands.
            // Android then shows the "Android App Compatibility" dialog on
            // launch — it fires only for debuggable apps — complaining that the
            // proot jniLibs are not 16 KB page aligned (they are prebuilts
            // linked with the 4 KB default; libloader32.so is additionally an
            // ELF32 sitting in an arm64-v8a dir, which the checker reports as
            // "Unknown error"). Turning debuggable off removes the dialog and
            // the "debuggable app" security nag with it.
            //
            // Cost: `adb shell run-as` stops working, so CaptionService's
            // files/caption.log breadcrumb is unreadable. Build with
            // `-PdebuggableLauncher` when you need it back.
            debuggable project.hasProperty('debuggableLauncher')
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The Linux feature ships proot (+ its two loaders) as jniLibs. proot must
    // be a REAL FILE in the app's nativeLibraryDir so it can be exec'd (the one
    // place an app targeting SDK 35 may keep an executable — W^X-exempt) and so
    // its loaders resolve by absolute path. Legacy packaging extracts the .so
    // files at install instead of running them mapped from the APK; without it
    // nativeLibraryDir is empty and proot cannot launch. Pairs with
    // android:extractNativeLibs="true" in the manifest.
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

// The ONLY third-party dependency in this APK, and it is here because the
// alternative is writing ICE, DTLS-SRTP and SCTP by hand. Everything else in
// the launcher is platform API on purpose; WebRTC is the one problem the
// platform does not solve and nobody should solve twice.
//
// webrtc-sdk's build rather than the abandoned org.webrtc:google-webrtc: that
// one stopped at M92 in 2021 and does not build against a modern NDK. The
// unprefixed artifact keeps the `org.webrtc` package, which is what every
// piece of WebRTC documentation is written against; `android-prefixed` exists
// to avoid clashing with another WebRTC in the same process, and there is no
// other one here.
//
// Size: ~12 MB of native code per ABI, which the abiFilters above hold to the
// two this APK already ships. That is the price of reaching a phone that has
// no inbound route at all — see doc/web-viewer.md.
dependencies {
    implementation 'io.github.webrtc-sdk:android:144.7559.12'
}
