<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Written by LinuxOnDroid at every start, as /etc/dbus-1/session.d/oadx-apps.conf
     (doc/linux-apps-process.md).

     Apps the desktop starts run in a proot of their own (oadx-run). Both
     sessions' buses run as proot's fake root, and proot fakes a socket peer's
     user only for the processes it traces itself, so this bus sees such an app
     as the app's own Android user, oadx-android in /etc/passwd, and not as root.

     GLib's clients name no user and are taken as that one: it may connect.
     libdbus's clients say root, which the socket does not back, so they are
     refused that way and prove it with the cookie in /root/.dbus-keyrings
     instead, which only this app can read. Other apps on the phone are other
     users and can do neither.

     EXTERNAL is named again because every <auth> narrows the list to the ones
     named, and the distro's session.conf names only EXTERNAL. -->
<busconfig>
  <auth>EXTERNAL</auth>
  <auth>DBUS_COOKIE_SHA1</auth>
  <policy context="default">
    <allow user="oadx-android"/>
  </policy>
</busconfig>
