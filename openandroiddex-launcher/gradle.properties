org.gradle.jvmargs=-Xmx2048m
# True for the unit tests only: Robolectric (app/build.gradle, testImplementation)
# brings AndroidX test libraries, and AGP refuses those while this is false. The
# APK has no AndroidX or support-library dependency, so it builds the same either way.
android.useAndroidX=true
android.nonTransitiveRClass=true
